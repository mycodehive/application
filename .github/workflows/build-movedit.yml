name: Build MovEdit for GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "movedit/source/**"
      - "movedit/package.json"
      - "movedit/vite.config.js"
      - ".github/workflows/build-movedit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: movedit-pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: movedit
        run: npm install --no-audit --no-fund

      - name: Build MovEdit
        working-directory: movedit
        run: npm run build

      - name: Publish build into Pages path
        run: |
          rm -rf movedit/bundle
          cp movedit/dist/index.html movedit/index.html
          cp -R movedit/dist/bundle movedit/bundle

      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movedit/index.html movedit/bundle
          if git diff --cached --quiet; then
            echo "No build changes to commit."
            exit 0
          fi
          git commit -m "Build MovEdit for GitHub Pages [skip ci]"
          git push
